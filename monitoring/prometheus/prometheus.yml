global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Hono backend app endpoints
  - job_name: 'revelis-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']

  # Scrape host system resource metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Scrape Redis cache metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
